[project]
name = "semantic-layer-backend"
version = "3.0.0"
description = "语义层后端：语义建模、绑定、编译、问数与发布"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/golden", "tests/integration", "tests/e2e"]
pythonpath = [".", ".."]
addopts = "-q"