services:
  pg:
    image: pgvector/pgvector:pg16
    container_name: semantic-layer-pg
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: semantic_layer
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - semantic-layer-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d semantic_layer"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  semantic-layer-pgdata: